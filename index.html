<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>IVI 통합 시스템 — 서울안과</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b;
  --line:#e2e8f0; --line2:#cbd5e1; --brand:#1e40af; --brand2:#1e3a8a;
  --ok:#059669; --warn:#d97706; --danger:#dc2626; --info:#0369a1;
  --ok-bg:#ecfdf5; --warn-bg:#fffbeb; --danger-bg:#fef2f2; --info-bg:#eff6ff;
  --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(15,23,42,.1),0 4px 10px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.5}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--ink);color:#e2e8f0;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:11px;letter-spacing:3px;color:#94a3b8;font-weight:700;margin-bottom:4px}
.title{font-size:17px;font-weight:800;color:#fff;margin-bottom:22px;line-height:1.3}
.title span{color:#60a5fa}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;
  color:#cbd5e1;padding:10px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13.5px;
  text-align:left;margin-bottom:2px;transition:all .15s;font-weight:500}
nav button:hover{background:#1e293b;color:#fff}
nav button.active{background:#1e40af;color:#fff;font-weight:600}
nav button .ic{font-size:16px;width:20px;text-align:center}
.nav-section{font-size:10px;letter-spacing:2px;color:#64748b;font-weight:700;margin:20px 0 8px 12px;text-transform:uppercase}
.sidebar-foot{position:absolute;bottom:16px;left:16px;right:16px;font-size:11px;color:#64748b;border-top:1px solid #334155;padding-top:12px}

main{padding:28px 32px 60px;overflow-x:hidden}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px;flex-wrap:wrap}
h1{font-size:22px;font-weight:800;color:var(--ink)}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:none;
  padding:9px 16px;border-radius:6px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:all .15s}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--surface);border-color:var(--ink2)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b91c1c}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#047857}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--ink)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

/* ===== Stats Grid ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.stat[style*="cursor:pointer"]:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,64,175,.18);border-color:var(--brand)}
.stat .lbl{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.stat .val{font-size:28px;font-weight:800;color:var(--ink);line-height:1}
.stat .delta{font-size:12px;color:var(--muted);margin-top:6px}
.stat.accent{background:var(--brand);color:#fff}
.stat.accent .lbl{color:#bfdbfe}
.stat.accent .val{color:#fff}
.stat.accent .delta{color:#dbeafe}
.stat.danger .val{color:var(--danger)}
.stat.warn .val{color:var(--warn)}
.stat.ok .val{color:var(--ok)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f8fafc;font-weight:700;color:var(--ink2);padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.5px}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#f8fafc}
.tbl tr.row-overdue td{background:#fef2f2}
.tbl tr.row-overdue:hover td{background:#fee2e2}
.tbl tr.row-today td{background:#eff6ff;font-weight:500}
.tbl tr.row-today:hover td{background:#dbeafe}
.tbl tr.clickable{cursor:pointer}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

/* ===== Badges ===== */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.3px}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.green{background:#d1fae5;color:#065f46}
.badge.amber{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.slate{background:#e2e8f0;color:#334155}
.badge.purple{background:#ede9fe;color:#5b21b6}
.badge.pink{background:#fce7f3;color:#9f1239}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.form-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);
  border-radius:6px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.field .hint{font-size:11px;color:var(--muted)}
.field textarea{resize:vertical;min-height:60px}
.radio-group{display:flex;gap:4px;flex-wrap:wrap}
.radio-group label{cursor:pointer;padding:7px 12px;border:1px solid var(--line2);border-radius:6px;font-size:13px;font-weight:500;background:#fff;transition:all .15s}
.radio-group label.checked{background:var(--brand);color:#fff;border-color:var(--brand)}
.radio-group input{display:none}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:100;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:720px;overflow:hidden;animation:slideUp .25s ease-out}
.modal-lg{max-width:900px}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#f8fafc}

/* ===== Search/Filter Bar ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--line2);border-radius:6px;font-family:inherit;font-size:13px;background:#fff}
.toolbar input{min-width:200px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--brand)}
.toolbar .spacer{flex:1}

/* ===== Detail Panel ===== */
.detail-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-bottom:20px}
.detail-grid .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.detail-grid .info-row .lbl{color:var(--muted);font-weight:500}
.detail-grid .info-row .val{font-weight:600}
.schedule-box{background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%);color:#fff;padding:20px;border-radius:var(--radius);margin-bottom:16px}
.schedule-box .lbl{font-size:11px;letter-spacing:2px;color:#bfdbfe;font-weight:700;margin-bottom:6px}
.schedule-box .date{font-size:26px;font-weight:800;margin-bottom:4px}
.schedule-box .sub{font-size:12px;color:#dbeafe}
.schedule-box.overdue{background:linear-gradient(135deg,#dc2626 0%,#991b1b 100%)}
.schedule-box.overdue .lbl{color:#fecaca}
.schedule-box.overdue .sub{color:#fee2e2}
.schedule-box.stopped{background:linear-gradient(135deg,#64748b 0%,#475569 100%)}

.inj-timeline{margin-top:14px}
.inj-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}
.inj-item .no{background:var(--brand);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.inj-item .date-blk{font-weight:700;font-size:13px}
.inj-item .date-blk .d{color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.inj-item .meta{font-size:12px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap}
.inj-item .meta b{color:var(--ink)}
.inj-item.complication{border-color:var(--warn);background:var(--warn-bg)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{background:none;border:none;padding:10px 18px;font-family:inherit;font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--brand);border-color:var(--brand)}

/* ===== Utility ===== */
.mt-12{margin-top:12px}
.mt-20{margin-top:20px}
.flex{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.hidden{display:none !important}
.text-right{text-align:right}
.text-muted{color:var(--muted)}
.tiny{font-size:11px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ===== Mobile ===== */
.menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;top:0;left:-260px;width:240px;height:100vh;z-index:50;transition:left .2s}
  aside.open{left:0}
  main{padding:20px 16px 60px}
  .menu-toggle{display:inline-block}
  .detail-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-grid.cols-3,.form-grid.cols-4{grid-template-columns:repeat(2,1fr)}
  .inj-item{grid-template-columns:1fr;gap:6px}
  h1{font-size:19px}
}

/* ==========================================
   MANUAL VIEW (의료진 프로토콜) — scoped styles
========================================== */
.manual-view{
  --m-ink:#101418; --m-paper:#fafaf7; --m-accent:#8b1a1a; --m-accent2:#1e4d6b;
  --m-warn:#b45309; --m-ok:#15803d; --m-rule:#d4d0c5; --m-muted:#6b6660;
  background:var(--m-paper); color:var(--m-ink);
  font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; font-size:15px; line-height:1.7;
  padding:32px 36px; margin:-28px -32px 0; min-height:calc(100vh - 20px);
}
.manual-view .m-head{border-bottom:3px double var(--m-ink);padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.manual-view .m-eyebrow{font-family:"Noto Sans KR",sans-serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--m-accent);font-weight:700;margin-bottom:10px}
.manual-view .m-title{font-size:28px;margin:0 0 6px;letter-spacing:-.5px;line-height:1.25;font-weight:800}
.manual-view .m-sub{color:var(--m-muted);font-size:13.5px}
.manual-view .m-toc{background:#f1ede3;border:1px solid var(--m-rule);padding:16px 20px;margin:20px 0 28px;font-family:"Noto Sans KR",sans-serif;font-size:13.5px}
.manual-view .m-toc b{display:block;margin-bottom:8px;font-size:12px;letter-spacing:2px;color:var(--m-accent)}
.manual-view .m-toc ol{margin:0;padding-left:20px;columns:2;column-gap:24px}
.manual-view .m-toc li{margin-bottom:4px;break-inside:avoid}
.manual-view .m-toc a{color:var(--m-ink);text-decoration:none;border-bottom:1px dotted var(--m-muted);cursor:pointer}
.manual-view h2{font-family:"Noto Sans KR",sans-serif;font-size:20px;margin:36px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--m-ink);letter-spacing:-.3px;color:var(--m-ink);font-weight:700}
.manual-view h2 .num{color:var(--m-accent);font-weight:700;margin-right:8px}
.manual-view h3{font-family:"Noto Sans KR",sans-serif;font-size:16px;margin:22px 0 8px;color:var(--m-accent2);font-weight:700}
.manual-view h4{font-family:"Noto Sans KR",sans-serif;font-size:14px;margin:14px 0 6px;font-weight:700}
.manual-view p,.manual-view li{font-size:14.5px;color:var(--m-ink)}
.manual-view ul,.manual-view ol{padding-left:22px;margin:6px 0}
.manual-view li{margin-bottom:4px}
.manual-view table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;font-family:"Noto Sans KR",sans-serif}
.manual-view th,.manual-view td{border:1px solid var(--m-rule);padding:8px 10px;text-align:left;vertical-align:top;background:#fff}
.manual-view th{background:#ece8dc;font-weight:600}
.manual-view .m-callout{border-left:4px solid var(--m-accent);background:#fdf6f6;padding:12px 16px;margin:14px 0;font-family:"Noto Sans KR",sans-serif;font-size:13.5px}
.manual-view .m-callout.warn{border-color:var(--m-warn);background:#fff7ed}
.manual-view .m-callout.ok{border-color:var(--m-ok);background:#f0fdf4}
.manual-view .m-callout.info{border-color:var(--m-accent2);background:#eff6ff}
.manual-view .m-callout b:first-child{display:block;margin-bottom:4px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--m-accent)}
.manual-view .m-callout.warn b:first-child{color:var(--m-warn)}
.manual-view .m-callout.ok b:first-child{color:var(--m-ok)}
.manual-view .m-callout.info b:first-child{color:var(--m-accent2)}
.manual-view .m-checklist{list-style:none;padding-left:0;font-family:"Noto Sans KR",sans-serif;font-size:14px}
.manual-view .m-checklist li{padding:6px 0 6px 28px;border-bottom:1px dashed var(--m-rule);position:relative;margin:0}
.manual-view .m-checklist li::before{content:"☐";position:absolute;left:0;top:6px;font-size:18px;color:var(--m-accent)}
.manual-view .m-step{display:flex;gap:16px;margin:14px 0;padding:12px;background:#fff;border:1px solid var(--m-rule)}
.manual-view .m-step .n{flex-shrink:0;width:34px;height:34px;background:var(--m-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:"Noto Sans KR",sans-serif;font-size:14px}
.manual-view .m-step .c{flex:1;font-family:"Noto Sans KR",sans-serif;font-size:14px}
.manual-view .m-step .c b{display:block;font-size:14.5px;margin-bottom:3px}
.manual-view .m-small{font-size:12.5px;color:var(--m-muted)}
.manual-view .m-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.manual-view .m-grid2 > div{background:#fff;border:1px solid var(--m-rule);padding:14px}
.manual-view .m-grid2 h4{margin-top:0}
.manual-view .m-ref{font-family:"Noto Sans KR",sans-serif;font-size:11.5px;color:var(--m-muted);margin-top:40px;padding-top:16px;border-top:1px solid var(--m-rule)}

/* ==========================================
   CONSENT VIEW (환자 안내·동의서) — scoped styles
========================================== */
.consent-view{
  background:#eae6de; color:#1a1a1a;
  font-family:"Nanum Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.85;
  padding:20px 16px 40px; margin:-28px -32px 0;
}
.consent-view .c-toolbar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.consent-view .c-toolbar .patient-select{background:#fff;padding:10px 14px;border:1px solid #cbd5e1;border-radius:6px;font-family:inherit;font-size:14px;min-width:240px}
.consent-view .c-toolbar .c-btns{display:flex;gap:8px}
.consent-view .c-toolbar button{background:#0f172a;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-family:inherit;font-size:14px;cursor:pointer;font-weight:600}
.consent-view .c-toolbar button:hover{background:#1e293b}
.consent-view .c-toolbar button.ghost{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.consent-view .page{max-width:820px;margin:20px auto;background:#fff;padding:44px 48px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.consent-view .page + .page{margin-top:16px}
.consent-view .c-head{border-bottom:4px solid #0f172a;padding-bottom:16px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.consent-view .clinic{font-size:13px;color:#64748b;letter-spacing:2px}
.consent-view h1{font-size:25px;margin:8px 0 0;letter-spacing:-.5px;font-weight:800;color:#0f172a}
.consent-view .subtitle{color:#475569;font-size:14px;margin-top:4px}
.consent-view .big-note{background:#fff7ed;border:2px solid #ea580c;padding:18px 22px;margin:22px 0;font-size:15px;font-weight:600;line-height:1.7;color:#1a1a1a}
.consent-view .big-note b{color:#ea580c;display:block;margin-bottom:6px;font-size:13px;letter-spacing:3px}
.consent-view h2{font-size:18px;margin:26px 0 10px;padding-left:14px;border-left:6px solid #0f172a;font-weight:800;color:#0f172a}
.consent-view h3{font-size:16px;margin:16px 0 6px;color:#0f172a;font-weight:700}
.consent-view .consent-view h4{margin:0}
.consent-view p,.consent-view li{font-size:14.5px;color:#1a1a1a;margin:0}
.consent-view p{margin:6px 0}
.consent-view ul{padding-left:22px;margin:8px 0}
.consent-view ul li{margin-bottom:6px;list-style:disc}
.consent-view .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}
.consent-view .info-card{background:#f8fafc;border:1px solid #cbd5e1;padding:14px 16px;border-radius:6px}
.consent-view .info-card h4{margin:0 0 6px;font-size:14.5px;color:#0f172a;font-weight:700}
.consent-view .info-card p{margin:0;font-size:13.5px;color:#1a1a1a}
.consent-view .emergency{background:#7f1d1d;color:#fff;padding:18px 22px;margin:20px 0;border-radius:8px}
.consent-view .emergency b:first-child{display:block;font-size:12px;letter-spacing:4px;color:#fca5a5;margin-bottom:10px}
.consent-view .emergency h3{margin:0 0 8px;color:#fff;font-size:17px}
.consent-view .emergency ul{margin:6px 0 0;padding-left:20px}
.consent-view .emergency li{color:#fee2e2;margin-bottom:4px;list-style:disc}
.consent-view .phone{font-size:20px;font-weight:800;letter-spacing:1px;margin-top:10px;color:#fff}
.consent-view .icon-list{list-style:none;padding:0;margin:10px 0}
.consent-view .icon-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed #cbd5e1;list-style:none;margin:0}
.consent-view .icon-list .ic{flex-shrink:0;width:30px;height:30px;background:#0f172a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.consent-view .c-timeline{margin:12px 0}
.consent-view .c-timeline-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #e2e8f0}
.consent-view .c-timeline-row .when{flex-shrink:0;width:100px;font-weight:700;color:#0f172a}
.consent-view .c-timeline-row .what{flex:1}
.consent-view .signature-box{margin-top:34px;border-top:2px solid #0f172a;padding-top:20px}
.consent-view .signature-box table{width:100%;border-collapse:collapse}
.consent-view .signature-box td{border:1px solid #94a3b8;padding:12px 10px;vertical-align:top;font-size:13.5px;background:#fff}

<script>
/* ==========================================
   API CONFIG — 배포 후 이 두 값을 채워 넣으세요
   (Apps Script 배포 URL과 동일한 토큰)
========================================== */
const API_CONFIG = {
  URL:   'https://script.google.com/macros/s/AKfycbwCVHY92q-WTcSi7yUZVUkT45am0co9f1u0H0prxBk0xs-MfxC_OboJd3so11FT0Nw_Kg/exec',
  TOKEN: 'seoul-eye-ivi-2026-749EtpqDRLGRDq17STSch9IN',
  SYNC_INTERVAL_MS: 60000,        // 백그라운드 동기화 주기 (60초)
  RETRY_INTERVAL_MS: 10000        // 실패 시 재시도 주기 (10초)
};

/* ==========================================
   DATA LAYER (localStorage 캐시 + 서버 동기화)
========================================== */
const STORAGE_KEY = 'ivi_manager_v2';
const QUEUE_KEY   = 'ivi_sync_queue_v2';
const META_KEY    = 'ivi_sync_meta_v2';

const DB = {
  patients: [],
  version: 2
};

// 동기화 상태 관리
const Sync = {
  status:   'init',    // 'init' | 'online' | 'offline' | 'syncing' | 'error' | 'local-only'
  lastPull: null,      // ISO string
  lastPush: null,
  queue:    [],        // pending operations
  error:    null,
  user:     '',
  deviceId: '',
  
  isConfigured(){
    return API_CONFIG.URL && API_CONFIG.URL.indexOf('script.google.com') >= 0;
  },
  
  setStatus(s, err){
    this.status = s;
    this.error = err || null;
    updateSyncIndicator();
  }
};

function loadDB(){
  // 1. localStorage에서 DB 불러오기
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const d = JSON.parse(raw);
      Object.assign(DB, d);
      if(!Array.isArray(DB.patients)) DB.patients = [];
    }catch(e){console.error('DB parse err',e)}
  } else {
    // v1 → v2 마이그레이션 (기존 사용자 데이터 보존)
    const v1 = localStorage.getItem('ivi_manager_v1');
    if(v1){
      try{
        const d = JSON.parse(v1);
        Object.assign(DB, d);
        DB.version = 2;
        if(!Array.isArray(DB.patients)) DB.patients = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      }catch(e){}
    }
  }
  
  // 2. 동기화 메타 정보 복원
  const metaRaw = localStorage.getItem(META_KEY);
  if(metaRaw){
    try{
      const m = JSON.parse(metaRaw);
      Sync.lastPull = m.lastPull;
      Sync.lastPush = m.lastPush;
      Sync.user     = m.user || '';
      Sync.deviceId = m.deviceId || '';
    }catch(e){}
  }
  if(!Sync.deviceId){
    Sync.deviceId = 'dev-' + Math.random().toString(36).slice(2, 10);
    saveMeta();
  }
  
  // 3. 대기 큐 복원
  const qRaw = localStorage.getItem(QUEUE_KEY);
  if(qRaw){
    try{ Sync.queue = JSON.parse(qRaw) || []; }catch(e){ Sync.queue = []; }
  }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  updateSidebarCounts();
}

function saveMeta(){
  localStorage.setItem(META_KEY, JSON.stringify({
    lastPull: Sync.lastPull,
    lastPush: Sync.lastPush,
    user: Sync.user,
    deviceId: Sync.deviceId
  }));
}

function saveQueue(){
  localStorage.setItem(QUEUE_KEY, JSON.stringify(Sync.queue));
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ==========================================
   API 호출 헬퍼
========================================== */
async function apiCall(params, timeoutMs){
  if(!Sync.isConfigured()){
    throw new Error('API 미설정');
  }
  const qs = new URLSearchParams({
    ...params,
    k: API_CONFIG.TOKEN,
    user: Sync.user || '(익명)',
    deviceId: Sync.deviceId
  });
  const url = API_CONFIG.URL + '?' + qs.toString();
  
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), timeoutMs || 30000);
  
  try {
    const res = await fetch(url, {
      method: 'GET',
      redirect: 'follow',
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || '서버 오류');
    return json;
  } catch(e) {
    clearTimeout(timeoutId);
    throw e;
  }
}

/* ==========================================
   PULL — 서버에서 전체 데이터 가져오기
========================================== */
async function pullFromServer(){
  if(!Sync.isConfigured()){ Sync.setStatus('local-only'); return false; }
  Sync.setStatus('syncing');
  try {
    const res = await apiCall({action:'listAll'});
    // 서버 데이터로 로컬 덮어쓰기 (큐에 대기 중인 변경사항은 별도 유지)
    DB.patients = (res.patients || []).map(p => {
      // 날짜 필드 정규화 (구글시트에서 Date 객체/ISO로 올 수 있음)
      p.startDate = normalizeDate(p.startDate);
      (p.injections || []).forEach(inj => {
        inj.date = normalizeDate(inj.date);
      });
      return {
        ...p,
        currentIntervalW: (DB.patients.find(x=>x.id===p.id) || {}).currentIntervalW || {},
        injections: (p.injections || [])
      };
    });
    
    // 환자별 currentIntervalW 재구성: 가장 최근 T&E 주사의 nextIntervalW를 사용
    DB.patients.forEach(p => {
      const byEye = {};
      (p.injections || []).forEach(inj => {
        if(inj.phase === 'TE' && inj.nextIntervalW){
          byEye[inj.eye] = inj.nextIntervalW;
        }
      });
      p.currentIntervalW = byEye;
    });
    
    Sync.lastPull = res.serverTime || new Date().toISOString();
    saveDB();
    saveMeta();
    Sync.setStatus('online');
    return true;
  } catch(e){
    console.warn('Pull failed:', e);
    Sync.setStatus(Sync.queue.length > 0 ? 'offline' : 'error', e.message);
    return false;
  }
}

/* ==========================================
   PUSH — 큐에 담긴 변경사항을 서버로 전송
========================================== */
async function flushQueue(){
  if(!Sync.isConfigured()) return;
  if(Sync.queue.length === 0) return;
  if(Sync.status === 'syncing') return; // 이미 동기화 중
  
  Sync.setStatus('syncing');
  const originalLength = Sync.queue.length;
  
  while(Sync.queue.length > 0){
    const op = Sync.queue[0];
    try {
      await apiCall(op.params);
      // 성공 — 큐에서 제거
      Sync.queue.shift();
      saveQueue();
    } catch(e){
      console.warn('Push failed:', op, e);
      Sync.setStatus('offline', e.message);
      // 10초 후 재시도
      setTimeout(()=>{
        if(navigator.onLine) flushQueue();
      }, API_CONFIG.RETRY_INTERVAL_MS);
      updateSyncIndicator();
      return false;
    }
  }
  
  Sync.lastPush = new Date().toISOString();
  saveMeta();
  Sync.setStatus('online');
  if(originalLength > 0) updateSidebarCounts();
  return true;
}

/* ==========================================
   ENQUEUE — 변경사항을 큐에 추가 후 전송 시도
========================================== */
function enqueue(params, description){
  if(!Sync.isConfigured()) return; // local-only 모드에서는 큐잉 불필요
  Sync.queue.push({params, description, at: new Date().toISOString()});
  saveQueue();
  updateSyncIndicator();
  // 비동기 전송 시도 (에러가 나도 앱 멈추지 않음)
  flushQueue().catch(e => console.warn(e));
}

  delete serverRecord.injections;
  delete serverRecord.currentIntervalW;
  enqueue({action:'savePatient', data: JSON.stringify(serverRecord)}, `환자 저장: ${p.name}`);
}

}

}

}

/* ==========================================
   SCHEDULE LOGIC
========================================== */
function getProtocol(drug, diagnosis){
  const d = DRUGS[drug];
  if(!d) return null;
  const load = d.loadingDefault[diagnosis] ?? d.loadingDefault.other ?? 3;
  return {drug:d, loadingCount:load};
}
function injectionsForEye(patient, eye){
  return (patient.injections||[]).filter(i=>i.eye===eye).sort((a,b)=>a.date.localeCompare(b.date));
}
function phaseForEye(patient, eye){
  const proto = getProtocol(patient.drug, patient.diagnosis);
  const count = injectionsForEye(patient, eye).length;
  if(count < proto.loadingCount) return {phase:'loading', next:count+1, total:proto.loadingCount};
  return {phase:'TE', intervalW: patient.currentIntervalW?.[eye] || proto.drug.teMin};
}

/* ==========================================
   DATE UTILITIES — 구글시트에서 Date 객체/ISO 문자열로 와도 안전하게 처리
========================================== */
function normalizeDate(s){
  // 입력: null | undefined | '' | 'YYYY-MM-DD' | 'YYYY-MM-DDTHH:mm:ss.sssZ' | Date 객체 | Excel 숫자
  // 출력: 'YYYY-MM-DD' 또는 null
  if(!s) return null;
  if(s instanceof Date){
    if(isNaN(s.getTime())) return null;
    return s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');
  }
  if(typeof s === 'number'){
    // Excel 시리얼 날짜 가능성
    if(s > 20000 && s < 80000){
      const d = new Date((s - 25569) * 86400 * 1000);
      if(!isNaN(d.getTime())) return normalizeDate(d);
    }
    return null;
  }
  if(typeof s === 'string'){
    // 이미 'YYYY-MM-DD' 형식
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // ISO timestamp — 앞 10자만 추출 (UTC 기준으로 날짜가 앞당겨질 수 있지만 일반 KST 입력이면 OK)
    if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
      // KST(UTC+9) 고려: Date 객체로 파싱 후 로컬 시간 기준으로 YYYY-MM-DD 추출
      const d = new Date(s);
      if(!isNaN(d.getTime())) return normalizeDate(d);
      return s.slice(0,10);
    }
    // YYYY/MM/DD 같은 변형
    const m = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
    if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    return null;
  }
  return null;
}

function addDays(dateStr, days){
  const n = normalizeDate(dateStr);
  if(!n) return null;
  const d = new Date(n+'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const na = normalizeDate(a), nb = normalizeDate(b);
  if(!na || !nb) return NaN;
  const d1 = new Date(na+'T00:00:00');
  const d2 = new Date(nb+'T00:00:00');
  return Math.floor((d2-d1)/(1000*60*60*24));
}
function nextScheduledDate(patient, eye){
  const injs = injectionsForEye(patient, eye);
  if(injs.length===0){
    return normalizeDate(patient.startDate) || todayStr();
  }
  const last = injs[injs.length-1];
  const lastDate = normalizeDate(last.date);
  if(!lastDate) return todayStr();
  const phase = phaseForEye(patient, eye);
  const proto = getProtocol(patient.drug, patient.diagnosis);
  if(phase.phase==='loading'){
    return addDays(lastDate, proto.drug.loadIntervalW*7);
  }else{
    const w = last.nextIntervalW || phase.intervalW;
    return addDays(lastDate, w*7);
  }
}
function getEyesForPatient(p){
  if(p.eye==='OU') return ['OD','OS'];
  return [p.eye];
}
function patientOverallStatus(p){
  if(p.status!=='active') return null;
  const eyes = getEyesForPatient(p);
  let minDaysToNext = Infinity;
  let nextDate = null;
  eyes.forEach(e=>{
    const d = nextScheduledDate(p, e);
    const diff = daysBetween(todayStr(), d);
    if(!isNaN(diff) && diff < minDaysToNext){minDaysToNext = diff; nextDate = d;}
  });
  if(nextDate === null) return null;
  return {nextDate, daysToNext:minDaysToNext};
}

  const day = ['일','월','화','수','목','금','토'][d.getDay()];

function renderScheduleTable(list, kind){
  // kind: 'overdue' | 'today' | 'week' — 로직은 동일, 라벨만 달라짐
  const sorted = list.slice().sort((a,b)=>{
    const da = normalizeDate(a.nextDate) || '9999';
    const db = normalizeDate(b.nextDate) || '9999';
    return da.localeCompare(db);
  });
  return `
    <table class="tbl">
      <thead><tr>
        <th>예정일</th><th>차트#</th><th>환자명</th><th>눈</th>
        <th>진단</th><th>약제</th><th>단계</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(({p, nextDate, daysToNext})=>{
          const eyes = getEyesForPatient(p);
          return eyes.map(e=>{
            const nd = nextScheduledDate(p,e);
            const diff = daysBetween(todayStr(), nd);
            if(isNaN(diff)) return '';
            // 각 섹션별로 해당 범위의 주사만 표시
            if(kind === 'overdue' && diff >= 0) return '';
            if(kind === 'today' && diff !== 0) return '';
            if(kind === 'week' && (diff <= 0 || diff > 7)) return '';
            const phase = phaseForEye(p,e);
            const phaseLabel = phase.phase==='loading'
              ? `Loading ${phase.next}/${phase.total}`
              : `T&E ${phase.intervalW || DRUGS[p.drug]?.teMin || '-'}w`;
            const rowCls = diff<0?'row-overdue':(diff===0?'row-today':'');
            const drugInfo = DRUGS[p.drug] || {color:'slate', name:p.drug||'-'};
            return `<tr class="${rowCls} clickable" onclick="openPatientDetail('${p.id}')">
              <td><b>${fmtDate(nd)}</b>${diff<0?` <span class="badge red">${-diff}일 지연</span>`:''}${diff===0?' <span class="badge blue">오늘</span>':''}</td>
              <td>${p.chartNo||'-'}</td>
              <td>${p.name||'-'}</td>
              <td><span class="badge slate">${e}</span></td>
              <td>${diagnosisName(p.diagnosis)}</td>
              <td><span class="badge ${drugInfo.color}">${drugInfo.name}</span></td>
              <td>${phaseLabel}</td>
              <td class="text-right">
                <button class="btn sm ok" onclick="event.stopPropagation();openInjectionForm('${p.id}','${e}')">주사 기록</button>
              </td>
            </tr>`;
          }).join('');
        }).join('')}
      </tbody>
    </table>`;
}

function renderThisWeek(){

  });

function renderScheduleView(opts){
  const root = document.getElementById('view-root');
  const today = todayStr();
  const active = DB.patients.filter(p=>p.status==='active');
  const list = [];
  active.forEach(p=>{
    getEyesForPatient(p).forEach(e=>{
      const nd = nextScheduledDate(p,e);
      const diff = daysBetween(today, nd);
      if(opts.filter(diff)){
        list.push({p, eye:e, nextDate:nd, diff});
      }
    });
  });
  list.sort((a,b)=>a.diff - b.diff || (a.p.name||'').localeCompare(b.p.name||''));
  
  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>${opts.title}</h1>
        <div class="page-sub">${opts.subFn(list, today)}</div>
      </div>
      <div class="flex">
        <button class="btn ghost sm" onclick="setView('dashboard')">← 대시보드</button>
        ${opts.showPrint?`<button class="btn ghost" onclick="window.print()">🖨 인쇄</button>`:''}
        <button class="btn" onclick="openPatientForm()">＋ 신규 환자</button>
      </div>
    </div>

    ${list.length===0?`<div class="card"><div class="empty">${opts.emptyText}<br><br>
      <button class="btn" onclick="setView('dashboard')">대시보드로 돌아가기</button></div></div>`:
      `<div class="card">
        <table class="tbl">
          <thead><tr>
            <th>순서</th><th>차트#</th><th>환자</th><th>나이</th><th>눈</th>
            <th>진단</th><th>약제</th><th>단계</th><th>예정일</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map((item,idx)=>{
              const {p, eye, nextDate, diff} = item;
              const phase = phaseForEye(p,eye);
              const drugInfo = DRUGS[p.drug] || {color:'slate', name:p.drug||'-', teMin:'-'};
              const phaseLabel = phase.phase==='loading'
                ? `Loading ${phase.next}/${phase.total}`
                : `T&E ${phase.intervalW || drugInfo.teMin}w`;
              const age = p.birth?(new Date().getFullYear() - parseInt(String(p.birth).slice(0,4))):'-';
              const rowCls = diff<0?'row-overdue':(diff===0?'row-today':'');
              const diffBadge = diff<0?` <span class="badge red">${-diff}일 지연</span>`
                : diff===0?` <span class="badge blue">오늘</span>`
                : diff<=7?` <span class="badge amber">${diff}일 후</span>`:'';
              return `<tr class="${rowCls} clickable" onclick="openPatientDetail('${p.id}')">
                <td><b>${idx+1}</b></td>
                <td>${p.chartNo||'-'}</td>
                <td><b>${p.name||'-'}</b></td>
                <td>${age}</td>
                <td><span class="badge slate">${eye}</span></td>
                <td>${diagnosisName(p.diagnosis)}</td>
                <td><span class="badge ${drugInfo.color}">${drugInfo.name}</span></td>
                <td>${phaseLabel}</td>
                <td>${fmtDate(nextDate)}${diffBadge}</td>
                <td class="text-right"><button class="btn sm ok" onclick="event.stopPropagation();openInjectionForm('${p.id}','${eye}')">주사 기록</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`
    }
  `;
}

/* ==========================================
   RENDER: MONTH INJECTIONS (이번달 주사 기록 전체)
========================================== */
function renderMonthInjections(){
  const root = document.getElementById('view-root');
  const today = todayStr();
  const ym = today.slice(0,7); // "2026-04"
  
  const rows = [];
  DB.patients.forEach(p=>{
    (p.injections||[]).forEach(inj=>{
      const d = normalizeDate(inj.date);
      if(!d) return;
      if(d.slice(0,7) !== ym) return;
      rows.push({p, inj, date: d});
    });
  });
  rows.sort((a,b)=>b.date.localeCompare(a.date) || (a.p.name||'').localeCompare(b.p.name||''));
  
  // 통계
  const drugCount = {};
  const complicationCount = {};
  rows.forEach(r=>{
    const dk = r.inj.drug || r.p.drug;
    drugCount[dk] = (drugCount[dk]||0) + 1;
    if(r.inj.complication && r.inj.complication !== 'none'){
      complicationCount[r.inj.complication] = (complicationCount[r.inj.complication]||0) + 1;
    }
  });
  
  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>이번달 주사 기록</h1>
        <div class="page-sub">${ym.replace('-','년 ')}월 · 총 ${rows.length}건</div>
      </div>
      <div class="flex">
        <button class="btn ghost sm" onclick="setView('dashboard')">← 대시보드</button>
        <button class="btn ghost" onclick="window.print()">🖨 인쇄</button>
        <button class="btn ghost" onclick="exportCSV('injections')">CSV 내보내기</button>
      </div>
    </div>
    
    ${rows.length>0 ? `
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="stat">
          <div class="lbl">총 주사 건수</div>
          <div class="val">${rows.length}</div>
          <div class="delta">이번달 누적</div>
        </div>
        ${Object.entries(drugCount).sort((a,b)=>b[1]-a[1]).map(([drug,count])=>{
          const di = DRUGS[drug] || {name:drug};
          return `<div class="stat">
            <div class="lbl">${di.name}</div>
            <div class="val">${count}</div>
            <div class="delta">${Math.round(count/rows.length*100)}%</div>
          </div>`;
        }).join('')}
        ${Object.keys(complicationCount).length>0 ? `
          <div class="stat danger">
            <div class="lbl">합병증</div>
            <div class="val">${Object.values(complicationCount).reduce((s,c)=>s+c,0)}</div>
            <div class="delta">${Object.entries(complicationCount).map(([k,v])=>`${k}:${v}`).join(', ')}</div>
          </div>
        ` : ''}
      </div>
    ` : ''}
    
    ${rows.length===0 ? `<div class="card"><div class="empty">이번달 주사 기록이 없습니다.<br><br>
      <button class="btn" onclick="setView('dashboard')">대시보드로 돌아가기</button></div></div>` : 
      `<div class="card mt-20">
        <table class="tbl">
          <thead><tr>
            <th>주사일</th><th>차트#</th><th>환자</th><th>눈</th>
            <th>약제</th><th>Lot</th><th>IOP (전→후)</th><th>BCVA (전→후)</th>
            <th>단계</th><th>합병증</th>
          </tr></thead>
          <tbody>
            ${rows.map(({p, inj, date})=>{
              const drugCode = inj.drug || p.drug;
              const drugInfo = DRUGS[drugCode] || {color:'slate', name:drugCode||'-'};
              const hasComp = inj.complication && inj.complication !== 'none';
              const phaseLabel = inj.phase==='loading' ? `Loading ${inj.loadNum}/${inj.loadTotal}`
                : inj.phase==='TE' ? `T&E ${inj.nextIntervalW||'-'}w` : '-';
              return `<tr class="clickable ${hasComp?'row-overdue':''}" onclick="openPatientDetail('${p.id}')">
                <td><b>${fmtDate(date)}</b></td>
                <td>${p.chartNo||'-'}</td>
                <td><b>${p.name||'-'}</b></td>
                <td><span class="badge slate">${inj.eye||'-'}</span></td>
                <td><span class="badge ${drugInfo.color}">${drugInfo.name}</span></td>
                <td class="tiny">${inj.lot||'-'}</td>
                <td class="tiny">${inj.iopPre!=null?`${inj.iopPre}→${inj.iopPost||'-'}`:'-'}</td>
                <td class="tiny">${inj.vaPre?`${inj.vaPre}→${inj.vaPost||'-'}`:'-'}</td>
                <td class="tiny">${phaseLabel}</td>
                <td>${hasComp?`<span class="badge red">⚠ ${inj.complication}</span>`:'<span class="text-muted">-</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`
    }
  `;
}

/* ==========================================
   RENDER: PATIENTS LIST
========================================== */
let patientFilter = {q:'', status:'all', drug:'all'};

function buildPatientListHtml(){
  const q = patientFilter.q.toLowerCase();
  let list = DB.patients.filter(p=>{
    if(patientFilter.status!=='all' && p.status!==patientFilter.status) return false;
    if(patientFilter.drug!=='all' && p.drug!==patientFilter.drug) return false;
    if(q){
      const hay = `${p.name||''} ${p.chartNo||''} ${p.birth||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
  
  const listHtml = list.length===0 ? '<div class="empty">조건에 맞는 환자가 없습니다</div>' :
    `<table class="tbl">
      <thead><tr>
        <th>차트#</th><th>환자</th><th>생년월일</th><th>눈</th>
        <th>진단</th><th>약제</th><th>단계</th><th>주사</th>
        <th>다음 예정</th><th>상태</th>
      </tr></thead>
      <tbody>
        ${list.map(p=>{
          const eyes = getEyesForPatient(p);
          const primaryEye = eyes[0];
          const phase = phaseForEye(p, primaryEye);
          const drugInfo = DRUGS[p.drug] || {color:'slate', name:p.drug||'-', teMin:'-'};
          const phaseLabel = phase.phase==='loading'
            ? `Loading ${phase.next-1}/${phase.total}`
            : `T&E ${phase.intervalW || drugInfo.teMin}w`;
          const totalInj = (p.injections||[]).length;
          const s = patientOverallStatus(p);
          let nextCell = '-';
          if(p.status==='active' && s){
            const days = s.daysToNext;
            const badge = days<0?`<span class="badge red">${-days}일 지연</span>`:
              days===0?`<span class="badge blue">오늘</span>`:
              days<=7?`<span class="badge amber">${days}일 후</span>`:'';
            nextCell = `${fmtDate(s.nextDate)} ${badge}`;
          }
          return `<tr class="clickable" onclick="openPatientDetail('${p.id}')">
            <td>${p.chartNo||'-'}</td>
            <td><b>${p.name||''}</b></td>
            <td class="tiny">${p.birth||'-'}</td>
            <td><span class="badge slate">${p.eye||'-'}</span></td>
            <td>${diagnosisName(p.diagnosis)}</td>
            <td><span class="badge ${DRUGS[p.drug]?.color||'slate'}">${DRUGS[p.drug]?.name||p.drug}</span></td>
            <td class="tiny">${phaseLabel}</td>
            <td>${totalInj}회</td>
            <td>${nextCell}</td>
            <td><span class="badge ${p.status==='active'?'green':p.status==='paused'?'amber':'slate'}">${p.status==='active'?'치료중':p.status==='paused'?'유예':'종료'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  return {html: listHtml, total: DB.patients.length, shown: list.length};
}

function updatePatientList(){
  const r = buildPatientListHtml();
  const listRoot = document.getElementById('patient-list-root');
  const countEl = document.getElementById('patient-count-display');
  if(listRoot) listRoot.innerHTML = r.html;
  if(countEl) countEl.textContent = `전체 ${r.total}명 · 표시 ${r.shown}명`;
}

// 한글 IME 대응: composition 중에는 필터 실행 안 함
let _searchCompositing = false;
function handleSearchInput(el){
  patientFilter.q = el.value;
  if(!_searchCompositing) updatePatientList();
}
function handleSearchCompositionEnd(el){
  _searchCompositing = false;
  patientFilter.q = el.value;
  updatePatientList();
}

function renderPatients(){
  const root = document.getElementById('view-root');
  const r = buildPatientListHtml();
  
  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>환자 관리</h1>
        <div class="page-sub" id="patient-count-display">전체 ${r.total}명 · 표시 ${r.shown}명</div>
      </div>
      <button class="btn" onclick="openPatientForm()">＋ 신규 환자 등록</button>
    </div>

    <div class="toolbar">
      <input type="text" placeholder="이름·차트번호·생년월일 검색" 
        value="${patientFilter.q.replace(/"/g,'&quot;')}" 
        oninput="handleSearchInput(this)"

      <select onchange="patientFilter.status=this.value; updatePatientList()">

      </select>
      <div class="spacer"></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div id="patient-list-root">${r.html}</div>
    </div>
  `;
}

function setupRadioGroups(){
  document.querySelectorAll('.radio-group').forEach(g=>{
    g.querySelectorAll('label').forEach(l=>{
      l.addEventListener('click', ()=>{
        g.querySelectorAll('label').forEach(x=>x.classList.remove('checked'));
        l.classList.add('checked');
      });
    });
  });
}

function savePatient(editId){
  const form = document.getElementById('patient-form');
  const d = Object.fromEntries(new FormData(form));
  d.dm = form.dm.checked;
  d.htn = form.htn.checked;
  d.antiCoag = form.antiCoag.checked;

  let p;
  if(editId){
    p = DB.patients.find(x=>x.id===editId);
    Object.assign(p, d);
  }else{
    p = {
      id: uid(),
      injections: [],
      currentIntervalW: {},
      ...d
    };
    DB.patients.push(p);
  }
  saveDB();
  syncPatient(p);
  closeModal();
  if(editId) renderPatientDetail(DB.patients.find(x=>x.id===editId));
  else render();
}

function openInjectionForm(patientId, eye){
  const p = DB.patients.find(x=>x.id===patientId);
  if(!p) return;
  const phase = phaseForEye(p, eye);
  const proto = getProtocol(p.drug, p.diagnosis);
  const isLoading = phase.phase==='loading';
  
  let intervalOptions = '';
  if(!isLoading){
    const min = proto.drug.teMin;
    const max = proto.drug.teMax;
    const step = proto.drug.teStep;
    const current = phase.intervalW || min;
    for(let w=min; w<=max; w+=step){
      const tag = w===current?'(현재)':w<current?'(단축)':'(연장)';
      intervalOptions += `<option value="${w}" ${w===current?'selected':''}>${w}주 ${tag}</option>`;
    }
  }

  openModal(`
    <div class="modal-head">
      <h2>주사 기록 — ${p.name} ${eye==='OD'?'(우안)':'(좌안)'}</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="card" style="background:var(--info-bg);border-color:var(--info);margin-bottom:16px;padding:14px">
        <div style="font-size:13px;color:var(--info);font-weight:600;margin-bottom:4px">현재 단계</div>
        <div style="font-weight:700">${isLoading?`Loading 단계 · ${phase.next}회차 / 전체 ${phase.total}회`:`T&E 단계 · 현재 ${phase.intervalW||proto.drug.teMin}주 간격`}</div>
        <div class="tiny text-muted mt-12">${isLoading?`Loading 완료까지 ${phase.total - phase.next + 1}회 남음 · 다음 간격 ${proto.drug.loadIntervalW}주`:`간격 범위: ${proto.drug.teMin}–${proto.drug.teMax}주 (2주 단위 조정)`}</div>
      </div>

      <form id="inj-form" onsubmit="event.preventDefault(); saveInjection('${patientId}','${eye}')">
        <div class="form-grid cols-3">
          <div class="field"><label>주사일 <span class="req">*</span></label>
            <input type="date" name="date" required value="${todayStr()}"></div>
          <div class="field"><label>약제</label>
            <select name="drug">
              ${Object.entries(DRUGS).map(([k,v])=>`<option value="${k}" ${p.drug===k?'selected':''}>${v.name}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Lot No.</label>
            <input type="text" name="lot" placeholder="약제 lot"></div>
        </div>

        <hr>
        <div class="tiny text-muted">시술 전후 평가</div>
        <div class="form-grid cols-4 mt-12">
          <div class="field"><label>IOP 전 (mmHg)</label>
            <input type="number" name="iopPre" min="0" max="80"></div>
          <div class="field"><label>IOP 후 (mmHg)</label>
            <input type="number" name="iopPost" min="0" max="80"></div>
          <div class="field"><label>BCVA 전</label>
            <input type="text" name="vaPre" placeholder="예: 0.5"></div>
          <div class="field"><label>BCVA 후</label>
            <input type="text" name="vaPost" placeholder="예: 0.5"></div>
        </div>

        <hr>
        <div class="tiny text-muted">다음 방문 계획</div>
        ${isLoading?`
          <div class="form-grid mt-12">
            <div class="field full">
              <label>다음 예정일</label>
              <input type="date" name="nextDate" required value="${addDays(todayStr(), proto.drug.loadIntervalW*7)}">
              <span class="hint">Loading 간격 ${proto.drug.loadIntervalW}주 기준 자동 계산됨</span>

        `:`

              <select name="response" required onchange="adjustTEInterval(this,'${patientId}','${eye}')">

            <div class="field">

              <select name="nextIntervalW" id="interval-select" required>${intervalOptions}</select>

      const w = parseInt(intSel.value);
      const date = document.querySelector('[name=date]').value;
      document.querySelector('[name=nextDate]').value = addDays(date, w*7);
    };
    intSel.addEventListener('change', updateNextDate);
    document.querySelector('[name=date]').addEventListener('change', updateNextDate);
    updateNextDate();
  }
}

function adjustTEInterval(sel, patientId, eye){
  const p = DB.patients.find(x=>x.id===patientId);
  const phase = phaseForEye(p, eye);
  const proto = getProtocol(p.drug, p.diagnosis);
  const current = phase.intervalW || proto.drug.teMin;
  const step = proto.drug.teStep;
  const min = proto.drug.teMin;
  const max = proto.drug.teMax;
  
  let newW = current;
  if(sel.value==='stable') newW = Math.min(current + step, max);
  else if(sel.value==='recurrent') newW = Math.max(current - step, min);
  
  const intSel = document.getElementById('interval-select');
  intSel.value = newW;
  intSel.dispatchEvent(new Event('change'));
}

function saveInjection(patientId, eye){
  const form = document.getElementById('inj-form');
  const d = Object.fromEntries(new FormData(form));
  const p = DB.patients.find(x=>x.id===patientId);
  const phase = phaseForEye(p, eye);
  const proto = getProtocol(p.drug, p.diagnosis);

  const inj = {
    id: uid(),
    eye,
    date: d.date,
    drug: d.drug,
    lot: d.lot,
    iopPre: d.iopPre?parseInt(d.iopPre):null,
    iopPost: d.iopPost?parseInt(d.iopPost):null,
    vaPre: d.vaPre,
    vaPost: d.vaPost,
    surgeon: d.surgeon,
    complication: d.complication,
    notes: d.notes,
    phase: phase.phase,
    loadNum: phase.phase==='loading'?phase.next:null,
    loadTotal: phase.phase==='loading'?phase.total:null,
    nextIntervalW: phase.phase==='TE'?parseInt(d.nextIntervalW):proto.drug.loadIntervalW,
    response: d.response
  };

  p.injections = p.injections || [];
  p.injections.push(inj);
  
  // Update current interval for T&E
  if(phase.phase==='TE' && d.nextIntervalW){
    p.currentIntervalW = p.currentIntervalW || {};
    p.currentIntervalW[eye] = parseInt(d.nextIntervalW);
  }

  saveDB();
  syncInjection(inj, patientId);
  closeModal();
  renderPatientDetail(p);
}

  const p = DB.patients.find(x=>x.id===patientId);
  p.injections = p.injections.filter(i=>i.id!==injId);
  saveDB();
  syncDeleteInjection(injId);
  renderPatientDetail(p);
}
function confirmDelete(id){
  const p = DB.patients.find(x=>x.id===id);
  if(!confirm(`${p.name} 환자 정보와 모든 주사 기록을 완전히 삭제합니다.\n계속하시겠습니까?`)) return;
  const name = p.name;
  DB.patients = DB.patients.filter(x=>x.id!==id);
  saveDB();
  syncDeletePatient(id, name);
  setView('patients');
}

/* ==========================================
   RENDER: SCHEDULE (Calendar View)
========================================== */
function renderSchedule(){
  const root = document.getElementById('view-root');
  const today = todayStr();
  const start = new Date(today+'T00:00:00');
  const days = [];
  for(let i=0;i<28;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    days.push(`${y}-${m}-${dd}`);
  }
  
  // Collect scheduled injections per day
  const byDay = {};
  DB.patients.filter(p=>p.status==='active').forEach(p=>{
    getEyesForPatient(p).forEach(e=>{
      const nd = normalizeDate(nextScheduledDate(p,e));
      if(!nd) return;
      if(!byDay[nd]) byDay[nd]=[];
      byDay[nd].push({p,e});
    });
  });
  
  // Past overdue
  const overdueByDay = {};
  DB.patients.filter(p=>p.status==='active').forEach(p=>{
    getEyesForPatient(p).forEach(e=>{
      const nd = normalizeDate(nextScheduledDate(p,e));
      if(!nd) return;
      if(nd < today){
        if(!overdueByDay[nd]) overdueByDay[nd]=[];
        overdueByDay[nd].push({p,e});
      }
    });
  });

  root.innerHTML = `
    <div class="page-head">
      <div>
        <h1>일정 보기</h1>
        <div class="page-sub">향후 4주간 주사 예정</div>
      </div>
    </div>

    ${Object.keys(overdueByDay).length>0?`
      <div class="card" style="border-color:var(--danger);background:var(--danger-bg);margin-bottom:16px">
        <h3 style="color:var(--danger)">🚨 지연 환자</h3>
        ${Object.entries(overdueByDay).sort().map(([d,list])=>`
          <div style="margin-top:8px">
            <b>${fmtDateFull(d)}</b> · ${list.length}명
            <div style="margin-top:4px">
              ${list.map(({p,e})=>`<span class="badge red" style="margin:2px 4px 2px 0;cursor:pointer" onclick="openPatientDetail('${p.id}')">${p.name} (${e})</span>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `:''}

    <div class="card">
      <table class="tbl">
        <thead><tr><th>날짜</th><th>요일</th><th>건수</th><th>예정 환자</th></tr></thead>
        <tbody>
          ${days.map(d=>{
            const list = byDay[d]||[];
            const dd = new Date(d+'T00:00:00');
            const dow = ['일','월','화','수','목','금','토'][dd.getDay()];
            const isToday = d===today;
            return `<tr class="${isToday?'row-today':''}">
              <td><b>${fmtDateFull(d)}</b>${isToday?' <span class="badge blue">오늘</span>':''}</td>
              <td>${dow}</td>
              <td>${list.length>0?`<b>${list.length}</b>`:'<span class="text-muted">-</span>'}</td>
              <td>${list.map(({p,e})=>`<span class="badge ${DRUGS[p.drug]?.color||'slate'}" style="margin:2px 4px 2px 0;cursor:pointer" onclick="openPatientDetail('${p.id}')">${p.name||'-'} ${e}</span>`).join('')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function exportData(){
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `IVI_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(){
  const file = document.getElementById('import-file').files[0];
  if(!file){alert('파일을 선택해 주세요'); return}
  if(!confirm('현재 데이터가 모두 대체됩니다. 계속하시겠습니까?')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      Object.assign(DB, d);
      saveDB();
      alert('불러오기 완료');
      render();
    }catch(err){alert('파일 형식 오류: '+err.message)}
  };
  reader.readAsText(file);
}
function exportCSV(type){
  let rows = [];
  if(type==='patients'){
    rows.push(['차트번호','이름','생년월일','눈','진단','약제','상태','DM','HTN','알레르기','등록일','총주사수']);
    DB.patients.forEach(p=>{
      rows.push([p.chartNo||'', p.name||'', normalizeDate(p.birth)||'', p.eye||'', diagnosisName(p.diagnosis), DRUGS[p.drug]?.name||p.drug||'',
        STATUS[p.status]?.label||p.status||'', p.dm?'Y':'N', p.htn?'Y':'N', p.allergy||'', normalizeDate(p.startDate)||'', (p.injections||[]).length]);
    });
  }else{
    rows.push(['환자명','차트번호','주사일','눈','약제','Lot','IOP전','IOP후','VA전','VA후','단계','합병증','메모']);
    DB.patients.forEach(p=>{
      (p.injections||[]).forEach(i=>{
        rows.push([p.name||'', p.chartNo||'', normalizeDate(i.date)||'', i.eye||'', DRUGS[i.drug||p.drug]?.name||i.drug||'',
          i.lot||'', i.iopPre||'', i.iopPost||'', i.vaPre||'', i.vaPost||'',
          i.phase==='loading'?`Loading ${i.loadNum}/${i.loadTotal}`:`T&E ${i.nextIntervalW}w`,
          i.complication||'none', (i.notes||'').replace(/[\n,]/g,' ')]);
      });
    });
  }
  const csv = '\ufeff' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `IVI_${type}_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function resetAll(){
  const cfg = Sync.isConfigured();
  const msg = cfg 
    ? '이 브라우저의 로컬 캐시를 삭제합니다.\n(구글시트 서버 데이터는 안전하게 유지됩니다.)\n\n계속하시겠습니까?'
    : '정말로 모든 데이터를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.';
  if(!confirm(msg)) return;
  if(!cfg && !confirm('한 번 더 확인합니다. 이 작업은 되돌릴 수 없습니다.')) return;
  
  DB.patients = [];
  Sync.queue = [];
  Sync.lastPull = null;
  Sync.lastPush = null;
  saveDB();
  saveQueue();
  saveMeta();
  
  if(cfg){
    alert('로컬 캐시 삭제 완료. 다음 로드 시 서버에서 다시 가져옵니다.');
    // 서버에서 다시 가져오기
    pullFromServer().then(()=>render());
  } else {
    alert('초기화되었습니다');
    setView('dashboard');
  }
}

        <div><h4>고정 간격 (Fixed)</h4><p>Loading 후 q8w / q12w / q16w 등 고정. 환자 예측 쉽고 스케줄 관리 간편. 단, 일부 환자 과·과소치료 가능.</p></div>
      </div>

      <div class="m-callout ok"><b>도입 초기 권장 전략</b>
      도입 초반에는 <b>Eylea 2mg 또는 Vabysmo 기반 T&amp;E</b>로 표준화하시고, 드물게 Ozurdex(RVO·DME 특정 환자)를 병용하는 구조가 관리 부담·치료 효과 모두 균형적입니다. Beovu·Eylea HD는 운영 안정 이후 단계적 도입을 권합니다.</div>

      <h3>T&amp;E 운영 규칙 (예시)</h3>
      <ol>
        <li>Loading 완료 (AMD 3회, DME/RVO 5–6회)</li>
        <li>첫 T&amp;E 평가: 활동성 없으면 8주 후 다음 주사</li>
        <li>방문마다 주사 후 OCT·시력 평가. 안정이면 +2주, 활동성이면 −2주 (또는 현 간격 유지)</li>
        <li>최소 4주, 최대 16주 (Eylea 2mg은 12주 상한 권장)</li>
        <li>연속 3회 16주 안정 시 "유예(pause)" 후 월 1회 모니터링 고려</li>
      </ol>

      <h2 id="m-s4"><span class="num">04.</span>시술실 환경과 장비</h2>
      <h3>공간 요건</h3>
      <ul>
        <li>독립된 처치실(clean room 수준). 외래 통행 동선과 분리.</li>
        <li>HEPA 필터 또는 최소한 공기청정기 상시 가동, 시술 중 문 닫힘 유지.</li>
        <li>바닥·벽은 매일 소독. 세균/곰팡이 지표 주기적 측정.</li>
        <li>응급 카트 비치: 에피네프린, 항히스타민, 스테로이드, 산소, BP 모니터, AED.</li>
      </ul>

      <h3>장비 목록</h3>
      <table>
        <tr><th style="width:30%">품목</th><th>세부</th></tr>
        <tr><td>Slit lamp (처치실 또는 인접)</td><td>시술 전후 평가용</td></tr>
        <tr><td>수평 리클라이닝 의자 또는 시술용 침상</td><td>리클라이닝 각도 충분히 확보</td></tr>
        <tr><td>수술 조명</td><td>LED 조명, 그림자 최소</td></tr>
        <tr><td>무균 시술 트레이</td><td>개별 포장 kit 또는 원내 멸균</td></tr>
        <tr><td>Lid speculum (소·중)</td><td>무균 disposable 권장</td></tr>
        <tr><td>캘리퍼 (3.5 mm / 4.0 mm)</td><td>윤부 거리 측정</td></tr>
        <tr><td>30G × 1/2″ (13 mm) 주사바늘</td><td>Eylea/Lucentis/Vabysmo 표준. Ozurdex는 전용 주입기.</td></tr>
        <tr><td>Filter needle (5 μm) 18–19G</td><td>바이알 제제용 (Triamcinolone 등)</td></tr>
        <tr><td>1 mL 투베르쿨린 주사기</td><td>Luer‑lock 권장</td></tr>
        <tr><td>5% Povidone‑iodine 안약</td><td>결막 소독 표준. 점안병 단회 사용 권장</td></tr>
        <tr><td>10% Povidone‑iodine</td><td>안검·피부 소독</td></tr>
        <tr><td>Topical anesthetic</td><td>Proparacaine 0.5% 또는 Tetracaine / Lidocaine 2% gel</td></tr>
        <tr><td>무균 면봉(Q‑tip), 거즈, 드레이프</td><td>일회용 포장</td></tr>
        <tr><td>점안 항생제</td><td>Moxifloxacin / Levofloxacin (술 후 예방적 사용은 선택적)</td></tr>
        <tr><td>Tonometer (iCare 또는 Goldmann)</td><td>시술 후 안압·광각지각 확인</td></tr>
        <tr><td>BSS 또는 생리식염수</td><td>세안·응급용</td></tr>
        <tr><td>폐기물 분류함</td><td>의료폐기물·주사바늘(sharps) 분리</td></tr>
      </table>

      <div class="m-callout info"><b>Tip</b>
      "주사 Kit"를 미리 제작해 두세요. 예: 멸균 포장 한 세트에 — 5% PVI 20 mL 드로퍼, 30G 바늘 2개(예비 포함), 1 mL 시린지 2개, 캘리퍼, 스페큘럼, 면봉 5개, 거즈 2장, 드레이프 1장. <b>시술 시간과 오류를 크게 줄입니다.</b></div>

      <h2 id="m-s5"><span class="num">05.</span>환자 스크리닝 (접수·외래)</h2>
      <h3>외래 평가 — 의사</h3>
      <ol>
        <li>적응증 확인 (OCT, FAG 또는 OCTA 근거). 가능하면 <b>영상 캡처·날짜 기록</b> 필수.</li>
        <li>시력(BCVA), 안압, 전안부·후안부 검사.</li>
        <li>당뇨·고혈압·항응고제·뇌심혈관 병력, 알레르기(특히 요오드·플루오로퀴놀론) 확인.</li>
        <li>치료 전략 결정 — 약제, 프로토콜, 시작일.</li>
        <li>동의서 설명 및 서명 (초회 시술 전 필수).</li>
        <li>EMR에 치료계획(약제/loading 횟수/T&amp;E 시작 기준) 명시.</li>
      </ol>

      <h3>접수 단계</h3>
      <ul>
        <li>시술 당일 감염(감기·발열·결막염) 유무 확인. 발열/결막염 있으면 연기.</li>
        <li>동반자(보호자) 동행 필수 안내 — 시술 후 흐릿함으로 독립 귀가 어려울 수 있음.</li>
        <li>주사 예정 약제·눈(R/L) 이중확인.</li>
        <li>식사·금식 불필요(경구 약 평소대로). 항응고제는 중단하지 않음.</li>
      </ul>

      <div class="m-callout warn"><b>Time‑Out 규칙</b>
      주사실 입실 직후 <b>Time‑Out</b>을 반드시 시행합니다. 환자 본인확인(이름·생년월일), 시술 눈(R/L), 약제명·용량, 알레르기. 간호사가 소리내어 읽고 의사가 confirm. 이 한 단계로 <b>잘못된 눈·잘못된 약제 사고 대부분을 예방</b>할 수 있습니다.</div>

      <h2 id="m-s6"><span class="num">06.</span>간호사 준비 단계 — Step by Step</h2>
      <div class="m-step"><div class="n">1</div><div class="c"><b>환자 식별 및 동의서 확인</b>차트·팔찌 또는 호명으로 환자 이름·생년월일 더블체크. 주사 동의서 서명 확인. 오늘 주사 <b>약제·눈(R/L)</b>을 환자에게 직접 말로 확인.</div></div>
      <div class="m-step"><div class="n">2</div><div class="c"><b>활력징후 및 당일 평가</b>혈압·맥박 측정 (고혈압·부정맥 확인). 당뇨 환자 혈당 참고. 오늘 눈 증상 변화(갑작스런 시력저하, 눈 통증, 결막충혈) 질문. 이상 시 의사 즉시 보고.</div></div>
      <div class="m-step"><div class="n">3</div><div class="c"><b>산동</b>Tropicamide 0.5% 또는 Mydrin‑P 점안 (총 2–3회, 5분 간격). 산동은 시술 자체에 필수는 아니나, <b>시술 후 안저 검사 위해 권장</b>. 환자 상태에 따라 생략 가능(의사 지시).</div></div>
      <div class="m-step"><div class="n">4</div><div class="c"><b>국소 마취 — 1차</b>산동과 동시에 Proparacaine 0.5% 점안 1회. 환자에게 "따끔할 수 있다"고 안내.</div></div>
      <div class="m-step"><div class="n">5</div><div class="c"><b>약제 준비</b>주사 바로 직전(시술실 입실 후) 약제를 냉장고에서 꺼내 실온화 상태 확인. 프리필드 시린지는 포장 상태 이상 유무, 유효기간, 제품 외관 확인. <b>바이알 제제는 필터 바늘로 흡인</b> 후 주사바늘 교체. 용량을 정확히 맞춰 남은 공기 제거.</div></div>
      <div class="m-step"><div class="n">6</div><div class="c"><b>시술실 환경 준비</b>시술대 소독. 조명 점검. 무균 시술 트레이 전개. 의사·간호사 마스크·캡 착용. 의사 손소독. 무균 장갑 준비.</div></div>
      <div class="m-step"><div class="n">7</div><div class="c"><b>환자 포지셔닝</b>리클라이닝 의자 또는 침상에 앙와위. 머리 위치 고정. 반대 눈 감아도 됨을 안내. 환자에게 "주사하는 눈은 크게 뜨고, 위쪽(또는 지정 방향)을 보게 안내할 것"이라고 설명.</div></div>
      <div class="m-step"><div class="n">8</div><div class="c"><b>소독 — 표준 프로토콜</b>
        <ol style="margin:6px 0 0">
          <li>안검·안검 주위 피부에 <b>10% Povidone‑iodine</b>으로 동심원 소독. 속눈썹·눈썹 포함. 2회.</li>
          <li>결막낭에 <b>5% Povidone‑iodine</b> 2–3방울 점안. 눈 깜박임 유도, 최소 <b>30–90초 유지</b>.</li>
          <li>무균 드레이프로 속눈썹 감싸고 스페큘럼 삽입.</li>
          <li>주사 직전 5% PVI 한 번 더 결막에 추가(선택적, 강력 권장).</li>
        </ol>
        <span class="m-small">PVI 알레르기 시 Chlorhexidine 0.05% 또는 Povacrylex — 그러나 대안 증거는 약함.</span>
      </div></div>
      <div class="m-step"><div class="n">9</div><div class="c"><b>2차 마취 (선택)</b>환자 통증 민감 시 Lidocaine 2% gel 2–3방울 결막낭에 추가, 또는 주사 부위에 lidocaine 2% 침윤 소량(고령자 권장). <b>PVI 소독 전 또는 후 프로토콜 고정</b>(원내 합의).</div></div>
      <div class="m-step"><div class="n">10</div><div class="c"><b>의사에게 인계 및 보조</b>스페큘럼 설치 확인 후 의사에게 "소독 완료, 좌안 Eylea 2mg 준비" 등 <b>소리내어 인계</b>. 주사 중 환자 손 잡아주기, 부드러운 음성 안내로 불안 완화. 주사 후 즉시 면봉 건네고 폐기물 분리.</div></div>

      <div class="m-callout info"><b>간호사 핵심 포인트</b>
      <b>① PVI 접촉 시간 확보</b>(최소 30초 이상) ② <b>무균장갑 착용 후 소독</b> 순서 지키기 ③ <b>Time‑Out 주도</b>는 간호사 역할. 의사가 시술에 집중하는 동안 안전망은 간호사가 만듭니다.</div>

      <h2 id="m-s7"><span class="num">07.</span>집도의 시술 단계</h2>
      <div class="m-step"><div class="n">1</div><div class="c"><b>최종 확인 (Time‑Out 재확인)</b>환자 이름·눈·약제·용량·만료일. 프리필드 시린지 공기 제거 완료 확인. 바늘 끝 손상 없음 확인.</div></div>
      <div class="m-step"><div class="n">2</div><div class="c"><b>손소독 · 무균장갑</b>외과적 손소독 (알콜 기반 rub 또는 스크럽). 무균장갑 착용. 마스크·캡 필수.</div></div>
      <div class="m-step"><div class="n">3</div><div class="c"><b>주사 부위 선택</b>
        <ul>
          <li><b>유수정체안(phakic):</b> 각막윤부에서 <b>4.0 mm</b> 후방 (수정체 손상 방지)</li>
          <li><b>위상체안/무수정체안(pseudo/aphakic):</b> <b>3.5 mm</b> 후방</li>
          <li>부위: 하이측(inferotemporal) 또는 상이측(superotemporal). 보통 우안은 하이측, 좌안도 하이측이 편함. 환자가 시선을 반대 방향으로 돌리게 하면 노출이 편함.</li>
          <li>캘리퍼로 윤부에서 측정 후 면봉 끝 또는 캘리퍼 자국으로 표시.</li>
        </ul>
      </div></div>
      <div class="m-step"><div class="n">4</div><div class="c"><b>주사 전 환자 안내</b>"지금부터 주사합니다. 눈은 위(또는 코) 쪽을 보세요. 따끔할 수 있지만 움직이지 말고 숨 편하게 쉬세요."</div></div>
      <div class="m-step"><div class="n">5</div><div class="c"><b>삽입</b>면봉으로 결막을 살짝 옆으로 이동(결막·공막 경로를 어긋나게 → 창 자가 봉쇄). 30G 바늘을 <b>공막에 수직</b>으로 삽입, 방향은 <b>시신경(안구 중심)</b>을 향해. 바늘 전체 길이(약 13 mm) 중 적절 깊이만 삽입.</div></div>
      <div class="m-step"><div class="n">6</div><div class="c"><b>주입</b>천천히 주입 (2–5초). 환자가 갑자기 움직이거나 통증을 호소하면 정지 후 위치 재확인. 주입 후 바늘을 <b>삽입 방향 그대로 빠르게 발출</b>, 동시에 면봉으로 <b>10–20초 압박</b> (역류 방지).</div></div>
      <div class="m-step"><div class="n">7</div><div class="c"><b>시력·광각 확인</b>스페큘럼 제거. 반대 눈을 가리고 <b>"손가락 몇 개로 보이세요?" 또는 "빛 보이세요?"</b> 질문. 완전한 시각 상실 시 CRAO 의심 — 즉시 안저 확인·전원 준비.</div></div>
      <div class="m-step"><div class="n">8</div><div class="c"><b>안저 확인 (간이)</b>간접검안경 또는 슬릿램프 +90D로 시신경·중심와 관찰. 시신경 관류(관류 양호/불량), 망막 중심 동맥 맥동, 망막박리 여부 확인.</div></div>
      <div class="m-step"><div class="n">9</div><div class="c"><b>IOP 측정 (필요 시)</b>일상적 필수는 아니나 <b>한눈·녹내장·주입 부피 큰 경우</b> iCare로 즉시 측정. 25 mmHg 이상이면 10–15분 후 재측정, 30 mmHg 초과 지속 시 전방천자 또는 하강 안약 고려.</div></div>
      <div class="m-step"><div class="n">10</div><div class="c"><b>점안 및 종료</b>Moxifloxacin/Levofloxacin 1방울 점안(선택적). 결막 세척(생리식염수)로 PVI 자극 완화. 환자 일으켜 앉히고 상태 확인.</div></div>

      <div class="m-callout warn"><b>주의 포인트 — 시술 중</b>
      <ul style="margin:4px 0 0">
        <li><b>바늘 재사용 금지.</b> 구부러지거나 접촉 오염 시 즉시 교체.</li>
        <li><b>속눈썹·안검 접촉 금지.</b> 스페큘럼과 드레이프로 철저 차단.</li>
        <li>주입 중 환자가 "갑자기 안 보인다"고 하면 CRAO 또는 심한 IOP 상승 — 즉시 안저 확인.</li>
        <li>결막하 출혈은 흔함(문제 없음, 환자 사전 안내).</li>
      </ul></div>

      <h2 id="m-s8"><span class="num">08.</span>시술 후 처치와 간호</h2>
      <h3>시술실 내</h3>
      <ul>
        <li>환자 호흡·자세 안정화. 어지러움 시 누운 상태에서 5분 휴식.</li>
        <li>시야·광각 정상 확인 후 보호 안대 또는 투명 실드. 일반적으로 안대는 짧게 — 귀가 시까지.</li>
        <li>시술 직후 간호사가 환자에게 <b>주의사항 유인물</b> 교부 및 구두 재설명.</li>
      </ul>

      <h3>귀가 후 환자 지침 (요약 — 상세는 안내문 참조)</h3>
      <ul>
        <li>당일 세안·샤워는 가능하되, 주사한 눈 문지르지 않기.</li>
        <li>24시간은 수영·사우나·안구 문지름 금지.</li>
        <li>당일 격한 운동·음주 제한.</li>
        <li>점안 항생제: 필요 시 처방 (4회/일 × 3–5일) — 원내 프로토콜 고정.</li>
        <li>결막하 출혈(빨간 반점)은 1–2주 내 소실, 걱정 없음.</li>
        <li><b>즉시 병원 전화/내원해야 할 증상:</b> 통증 악화, 시력 급격 저하, 눈 앞 검은 구름·섬광, 심한 충혈·분비물, 발열.</li>
      </ul>

      <h3>다음 방문 스케줄</h3>
      <ul>
        <li>Loading 중: 정확히 4주(28일) 후 재주사. 스케줄러에 자동 등록.</li>
        <li>T&amp;E: 평가·주사 동시. 다음 간격은 당일 OCT·시력 기준으로 결정.</li>
        <li>시술 후 이상 증상 자가 모니터링 기간 48–72시간. 첫 48시간 이내 전화 f/u 시스템 권장.</li>
      </ul>

      <h2 id="m-s9"><span class="num">09.</span>합병증과 대응</h2>
      <table>
        <tr><th>합병증</th><th>빈도</th><th>소견</th><th>대응</th></tr>
        <tr><td>결막하 출혈</td><td>흔함</td><td>빨간 반점, 통증 없음</td><td>안심 설명, 1–2주 내 소실</td></tr>
        <tr><td>일시적 부유물/섬광</td><td>흔함</td><td>주입 기포, 미세 출혈</td><td>경과 관찰. 심하면 안저검사</td></tr>
        <tr><td>안압 상승(일시)</td><td>흔함</td><td>주입 직후 IOP 30–50</td><td>10–15분 후 재측정, 지속 시 전방천자·하강제</td></tr>
        <tr><td>각막 미란</td><td>간헐적</td><td>PVI·마취제 자극, 이물감</td><td>인공눈물, 필요 시 항생제 연고, 하루 호전</td></tr>
        <tr><td>수정체 손상</td><td>드묾</td><td>바늘 위치 오류, 외상성 백내장</td><td>수술 전원 또는 내원원 수술 계획</td></tr>
        <tr><td>유리체 출혈</td><td>드묾</td><td>시력 급저하, 부유물 다수</td><td>안정, 경과관찰, 지속 시 수술</td></tr>
        <tr><td>망막박리</td><td>0.01–0.1%</td><td>섬광·커튼·시야 결손</td><td>즉시 안저검사 → 수술 전원</td></tr>
        <tr><td>안내염</td><td>0.02–0.05%</td><td>통증·충혈·전방축농·시력저하 (보통 3–7일)</td><td><b>응급 — 아래 섹션 참조</b></td></tr>
        <tr><td>IOI/망막혈관염 (Beovu 등)</td><td>Beovu 1–5%</td><td>부유물, 시야 결손, FAG 혈관염</td><td>즉시 중단, 스테로이드 치료, 전원</td></tr>
        <tr><td>알레르기·쇼크</td><td>드묾</td><td>두드러기·기도증상·저혈압</td><td>에피네프린·항히스타민·산소·119</td></tr>
        <tr><td>TAC (vascular, 전신)</td><td>매우 드묾</td><td>뇌경색·심근경색</td><td>anti‑VEGF 전신 위험 — 기왕력 환자 상의</td></tr>
      </table>

      <h2 id="m-s10"><span class="num">10.</span>안내염 응급 대응</h2>
      <p><b>안내염은 IVI의 가장 심각한 합병증</b>입니다. 발생 시 수시간 내 처치로 시력 보존 가능성이 달라집니다.</p>
      <h3>의심 증상 (환자가 호소)</h3>
      <ul>
        <li>주사 후 2–7일 이내 <b>통증 악화</b>, 충혈 증가, 시력 감소, 심한 부유물, 분비물.</li>
        <li>"주사 후 잠깐 좋아졌다가 다시 나빠짐" — 고위험 신호.</li>
      </ul>
      <h3>즉시 체크</h3>
      <ol>
        <li>BCVA 측정 (광각·수지동·HM 까지)</li>
        <li>세극등: 각막 혼탁, 전방 세포·축농(hypopyon), 홍채 후유착, 유리체 혼탁</li>
        <li>가능하면 B‑scan: 유리체 혼탁·망막박리 확인</li>
        <li>즉시 유리체 절제술·유리체강내 항생제 투여 가능한 망막 전문 기관 전원 결정</li>
      </ol>
      <h3>표준 대응 (전원 전)</h3>
      <ul>
        <li>유리체 천자(안방수·유리체액 배양) + 유리체강내 항생제 투여
          <ul>
            <li>Vancomycin 1 mg / 0.1 mL</li>
            <li>Ceftazidime 2.25 mg / 0.1 mL (penicillin allergy 시 Amikacin 0.4 mg / 0.1 mL)</li>
          </ul>
        </li>
        <li>국소 fortified 항생제 (Vancomycin 50 mg/mL, Ceftazidime 50 mg/mL) 30분 간격</li>
        <li>전신 치료는 진균 의심·중증에서</li>
        <li>반드시 <b>전원 협의 병원 사전 확보</b> (지역 대학병원 망막파트) — 도입 전 공식 협력체계 구축 권장</li>
      </ul>

      <div class="m-callout warn"><b>실무 권고</b>
      본원 도입 초기에는 유리체강내 항생제·천자 시술을 본원에서 수행하지 않더라도, <b>안내염 의심 → 30분 이내 전원 협약 병원 출발</b>의 프로토콜을 명문화하시는 것이 현실적입니다. 환자에게 "주사 후 2–7일 중 눈이 더 아프거나 갑자기 안 보이면 <u>즉시 병원 전화</u>"라고 반복 강조하세요.</div>

      <h2 id="m-s11"><span class="num">11.</span>감염 관리·소독·폐기물</h2>
      <h3>시술 당일 환경</h3>
      <ul>
        <li>시술 환자당 드레이프·스페큘럼·시린지·바늘 <b>모두 1회용</b>. 재사용 절대 금지.</li>
        <li>PVI 드로퍼는 환자 1인 1병 원칙(또는 당일 개봉·폐기).</li>
        <li>바닥·처치대 소독: 환자 간 알콜 와이프, 당일 종료 후 희석 차아염소산나트륨.</li>
        <li>마스크·캡: 시술자·간호사 모두 착용. 대화는 최소화(비말 → 안내염 주요 원인).</li>
      </ul>
      <h3>멸균·소독 검증</h3>
      <ul>
        <li>kit 포장 멸균 유효기간 확인 기록.</li>
        <li>공기·접촉 배양검사 분기별 시행(최소 반기별).</li>
        <li>안내염 발생 시 시술 기록·시약 lot·시간대 즉시 추적.</li>
      </ul>
      <h3>폐기물</h3>
      <ul>
        <li>주사바늘·시린지: sharps 전용함. 넘치기 전 교체.</li>
        <li>감염성 폐기물: 전용 용기 라벨링 후 지정 업체 수거.</li>
        <li>약제 바이알/시린지: 폐의약품 분리 배출.</li>
      </ul>

      <h2 id="m-s12"><span class="num">12.</span>기록·보험·청구 체크</h2>
      <h3>EMR 필수 기록</h3>
      <ul>
        <li>환자·눈·진단·약제·용량·로트·만료일</li>
        <li>시술 시각, 소독 프로토콜, 집도·간호사 이름</li>

        <li>특이사항(출혈, 기포, 환자 움직임 등) 및 합병증</li>
        <li>다음 방문 계획 (간격·날짜·약제)</li>
      </ul>
      <h3>보험·행정</h3>
      <ul>
        <li>산정특례(F5) 대상 여부 등록(해당 질환).</li>
        <li>급여 기준: OCT/FAG 영상, 시력 기준, 재주사 간격 준수 — <b>영상·시력 근거 누락이 삭감 1순위</b>.</li>
        <li>약가·주사료 청구 코드 원내 표준화.</li>
      </ul>
      <h3>질관리 지표 (분기별 리뷰)</h3>
      <ul>
        <li>월별 주사 건수 (약제별, 질환별)</li>
        <li>합병증 발생률 (안내염·IOI·IOP spike·기타)</li>
        <li>T&amp;E 간격 분포, 중단·전원 사례</li>
        <li>치료 반응률(OCT 두께 변화·시력 변화) — 6개월·12개월</li>
      </ul>

      <h2 id="m-s13"><span class="num">13.</span>체크리스트 모음</h2>
      <h3>체크리스트 ① 주사 준비 (간호사)</h3>
      <ul class="m-checklist">
        <li>환자 본인확인 (이름·생년월일·차트번호)</li>
        <li>동의서 서명 완료 확인</li>

        <li>활력징후 이상 없음</li>
        <li>당일 감염/결막염/발열 없음</li>

        <li>응급카트 위치·약제 점검</li>
      </ul>
      <h3>체크리스트 ② Time‑Out (소리 내어)</h3>
      <ul class="m-checklist">
        <li>"환자: ○○○, 주민 ○○○○○○"</li>
        <li>"주사 눈: 우안/좌안"</li>

      </ul>

      <ul class="m-checklist">

      <div class="m-ref">
      <b>참고 근거·가이드라인(요약):</b> American Society of Retina Specialists (ASRS) guidelines on intravitreal injections; AAO Preferred Practice Patterns (AMD, DR, RVO); 대한망막학회 지침; 약제별 제품 허가사항(식약처). 본 문서는 서울안과 내부 표준화를 위한 요약 가이드이며, 공식 가이드라인과 개별 환자 상태에 따라 집도의 판단이 우선합니다. 실제 도입 전 지역 대학병원 망막파트와 전원 협약을 권장합니다.
      </div>

function printDoc(docId){
  document.body.classList.add('print-isolated');
  document.querySelectorAll('.printable').forEach(el=>{
    el.classList.toggle('active-print', el.id === docId);
  });
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{
      document.body.classList.remove('print-isolated');
      document.querySelectorAll('.printable.active-print').forEach(el=>el.classList.remove('active-print'));
    }, 300);
  }, 50);
}

    `<option value="${pt.id}" ${pt.id===consentPatientId?'selected':''}>${pt.name} (${pt.chartNo||'차트번호 없음'}) · ${diagnosisName(pt.diagnosis)}</option>`
  ).join('');
  
  const pName = p ? p.name : '';
  const pChart = p ? (p.chartNo||'') : '';
  const pBirth = p ? (p.birth||'') : '';
  const pPhone = p ? (p.phone||'') : '';
  
  const dxCheck = (code)=> p && p.diagnosis===code ? '☑' : '☐';
  const eyeCheck = (code)=> p && p.eye===code ? '☑' : '☐';
  const drugCheck = (code)=> p && p.drug===code ? '☑' : '☐';
  
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  
  // 주사 후 안내문용 — 가장 최근 주사 기록 가져오기
  let lastInj = null;
  let nextDate = '';
  if(p && p.injections && p.injections.length){
    const sorted = [...p.injections].sort((a,b)=>b.date.localeCompare(a.date));
    lastInj = sorted[0];
    // 다음 예정일
    try{
      if(p.eye==='OU'){
        nextDate = fmtDateFull(nextScheduledDate(p, lastInj.eye||'OD'));
      }else{
        nextDate = fmtDateFull(nextScheduledDate(p, p.eye));
      }
    }catch(e){}
  }
  const injDate = lastInj ? fmtDateFull(lastInj.date) : `${yyyy}년 ${mm}월 ${dd}일`;
  const injDrug = lastInj ? (DRUGS[lastInj.drug||p.drug]?.name || lastInj.drug) : (p ? DRUGS[p.drug]?.name : '');
  const injEye = lastInj ? eyeName(lastInj.eye||p.eye) : (p ? eyeName(p.eye) : '');
  
  root.innerHTML = `

  switch(currentView){

    case 'today': renderToday(); break;

    case 'thisWeek': renderThisWeek(); break;
    case 'monthInjections': renderMonthInjections(); break;
    case 'patients': renderPatients(); break;
    case 'schedule': renderSchedule(); break;
    case 'protocols': renderProtocols(); break;
    case 'manual': renderManual(); break;
    case 'consent': renderConsent(); break;
    case 'nurseGuide': renderNurseGuide(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard();
  }
}
